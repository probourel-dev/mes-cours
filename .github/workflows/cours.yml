# Cours de clôture des ISIN de isins.txt : chaque soir de semaine, et à chaque changement de la liste ou du script.
name: Cours
on:
  schedule:
    - cron: "40 19 * * 1-5"   # 20 h 40 à Paris l'hiver, 21 h 40 l'été : après les publications du soir
  push:
    branches: [main]
    paths: ["isins.txt", "recuperer.py", ".github/workflows/cours.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cours
  cancel-in-progress: false
jobs:
  cours:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les cours
        run: python3 recuperer.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Cours du $(date -u +%d/%m/%Y)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
